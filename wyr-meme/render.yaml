services:
  - type: web
    name: would-you-rather-meme
    runtime: node
    rootDir: wyr-meme
    plan: free
    region: frankfurt
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SIM_BOTS
        value: "false"
      - key: ROUND_MS
        value: "60000"
      - key: VOTE_THRESHOLD
        value: "1000"
